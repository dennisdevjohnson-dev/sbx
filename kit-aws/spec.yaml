# sbx kit (v0.39 schema). Carries the ACCOUNT VALUES + allowlist; the image stays generic.
#   sbx run -t <template> --kit ./sbx/kit-aws claude            (RO)
#   sbx run -t <template> --kit ./sbx/kit-aws -e AWS_PROFILE=sandbox-rw claude
# Work: copy this kit, change the three account values (and role names if theirs differ).
schemaVersion: 1
kind: mixin
name: aws-lab
description: AWS SSO badge (ro default), account values, Terraform/AWS egress allowlist. Model backend is the user's choice (/login) — add kit-bedrock to preset Bedrock.

environment:
  variables:
    SSO_START_URL: https://d-90667c720b.awsapps.com/start
    AWS_ACCOUNT_ID: "350823026613"
    SSO_REGION: us-east-1
    AWS_REGION: us-east-1
    AWS_PROFILE: sandbox-ro        # -e AWS_PROFILE=sandbox-rw for the write badge

commands:
  startup:
    - command: ["aws-badge"]

network:
  allowedDomains:
    - "*.amazonaws.com"
    - "*.awsapps.com"
    - "*.aws.amazon.com"
    - "*.app.aws"
    - "registry.terraform.io"
    - "releases.hashicorp.com"
    - "*.anthropic.com"
    - "*.claude.ai"
    - "*.openai.com"
    - "*.chatgpt.com"
    - "github.com"
    - "gitlab.com"

memory: |
  You are in an AWS lab sandbox. AWS auth is IAM Identity Center SSO; profiles were written by `aws-badge`.
  If an AWS command fails with "Error loading SSO Token" or a credentials error,
  run `aws sso login --use-device-code` and show the user the URL + code.
  AWS_PROFILE is sandbox-ro (read-only) unless the user launched with sandbox-rw.
  If ~/.aws/config is missing, run `aws-badge` (needs SSO_START_URL and AWS_ACCOUNT_ID in the environment).
