# sbx kit: AWS badge writer + AWS instructions. NO account values — pass them with -e at launch. Fence is kit-fw.
#   sbx run -t <template> --kit ./sbx/kit-aws claude            (RO)
#   sbx run -t <template> --kit ./sbx/kit-aws -e AWS_PROFILE=sandbox-rw claude

schemaVersion: 1
kind: mixin
name: aws-lab
description: AWS SSO badge writer (aws-badge at start) + AWS guidance. Model backend is the user's choice (/login); add kit-bedrock to preset Bedrock.

environment:
  variables:
    # No account values here. Supply at launch and aws-badge writes ~/.aws/config; otherwise blank.
    #   -e SSO_START_URL=https://<id>.awsapps.com/start -e AWS_ACCOUNT_ID=<12 digits> [-e SSO_REGION=us-east-1]
    #   [-e RO_ROLE=<permission set> -e RW_ROLE=<permission set>]  [-e AWS_PROFILE=<ro|rw role name>]
    AWS_REGION: us-east-1

commands:
  startup:
    - command: ["aws-badge"]


memory: |
  You are in an AWS sandbox. AWS auth is IAM Identity Center SSO. If ~/.aws/config is missing, ask the user for
  SSO_START_URL and AWS_ACCOUNT_ID, then run `SSO_START_URL=... AWS_ACCOUNT_ID=... aws-badge` (or the user edits ~/.aws/config).
  If an AWS command fails with "Error loading SSO Token" or a credentials error,
  run `aws sso login --use-device-code` and show the user the URL + code.
  Set AWS_PROFILE to the badge (role) the user wants.
